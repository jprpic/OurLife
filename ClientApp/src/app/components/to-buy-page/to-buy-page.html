<section class="shopping-page" aria-label="To-buy shopping list">
    <div class="add-bar" aria-label="Add item globally">
        <input type="text" [value]="draft()" (input)="draft.set($any($event.target).value)" placeholder="Add an item..."
            aria-label="New shopping item" (keydown.enter)="onGlobalAdd()" />

        <select [value]="categoryDraft()" (change)="updateCategoryDraft($any($event.target).value)"
            aria-label="Select shopping category">
            @for (category of shoppingCategories; track category.id) {
            <option [value]="category.id">{{ category.label }}</option>
            }
        </select>

        <button type="button" class="primary-button" (click)="onGlobalAdd()">Add</button>
    </div>

    <div class="drawer-list">
        @for (category of visibleCategories(); track category.id) {
        <section class="drawer" [class.is-open]="isDrawerOpen(category.id)">
            <button class="drawer-header" type="button" (click)="toggleDrawer(category.id)">
                <span class="drawer-label">
                    {{ category.label }}
                    <small>{{ category.subtitle }}</small>
                </span>
                <span class="drawer-count">{{ uncheckedCount(category.id) }}</span>
            </button>

            @if (isDrawerOpen(category.id)) {
            <ul class="item-list">
                @for (item of itemsForCategory(category.id); track item.id) {
                <li [class.is-checked]="item.checked">
                    <label class="item-row">
                        <input type="checkbox" [checked]="item.checked" (change)="toggleItem(item.id)"
                            [attr.aria-label]="'Check ' + item.title" />
                        <span class="item-title">{{ item.title }}</span>
                    </label>
                </li>
                }
            </ul>
            }
        </section>
        }
    </div>

    <button type="button" class="clear-button" (click)="clearChecked()"
        [disabled]="!items().some(item => item.checked)">
        Clear Checked Items
    </button>
</section>
